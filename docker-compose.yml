services:
  postgres:
    image: postgres:16-alpine
    container_name: jobportal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: myjobportal
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d myjobportal"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: jobportal-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  seq:
    image: datalust/seq:latest
    container_name: jobportal-seq
    restart: unless-stopped
    ports:
      - "127.0.0.1:5341:80"
    environment:
      ACCEPT_EULA: Y
      SEQ_FIRSTRUN_ADMINPASSWORD: "LocalSeq@2026!"
    volumes:
      - seq_data:/data

  emailserver:
    image: rnwood/smtp4dev:prerelease
    container_name: JobPortalEmail
    restart: unless-stopped
    ports:
      - "127.0.0.1:2525:25"
      - "127.0.0.1:3000:80"
    volumes:
      - smtp4dev-data:/smtp4dev

volumes:
  postgres_data:
  redis_data:
  seq_data:
  smtp4dev-data:
